<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Auto-Retry</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <img src="icons/icon48.png" alt="Gemini Auto-Retry" class="brand-img">
        </div>
        <div>
          <h1>Auto-Retry</h1>
          <span class="subtitle">AI Prompt Guard</span>
        </div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </button>
      <button class="tab-btn" data-tab="patterns">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Triggers
      </button>
    </nav>

    <!-- Stats Bar -->
    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total Retries</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="statSuccess">0</span>
        <span class="stat-label">Successes</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value text-indigo" id="statStatus">Active</span>
        <span class="stat-label">Status</span>
      </div>
    </div>

    <!-- Tab 1: Settings -->
    <section id="tab-settings" class="tab-content active">
      <div class="form-group">
        <label for="delaySeconds">Initial Delay (seconds)</label>
        <div class="input-range-wrapper">
          <input type="range" id="delaySeconds" min="1" max="30" value="3">
          <span class="badge-value" id="delayVal">3s</span>
        </div>
      </div>

      <div class="form-group">
        <label for="maxRetries">Maximum Retry Attempts</label>
        <div class="input-range-wrapper">
          <input type="range" id="maxRetries" min="1" max="10" value="10">
          <span class="badge-value" id="maxRetriesVal">10</span>
        </div>
      </div>

      <div class="form-group toggle-row">
        <div>
          <span class="label-text">Infinite Retries</span>
          <span class="help-text">Keep retrying indefinitely until response succeeds</span>
        </div>
        <label class="toggle-switch small">
          <input type="checkbox" id="infiniteRetries">
          <span class="slider"></span>
        </label>
      </div>

    </section>

    <!-- Tab 2: Error Triggers/Patterns -->
    <section id="tab-patterns" class="tab-content">
      <div class="patterns-header">
        <span class="help-text">Matching text patterns in the chat page that trigger an auto-retry:</span>
      </div>
      <div class="add-pattern-box">
        <input type="text" id="newPatternInput" placeholder="Add custom error phrase..." />
        <button id="addPatternBtn" class="btn-primary">Add</button>
      </div>
      <ul id="patternsList" class="patterns-list">
        <!-- Dynamically populated -->
      </ul>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="saveBtn" class="btn-save">Save Changes</button>
      <div id="toast" class="toast hidden">Settings saved!</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
