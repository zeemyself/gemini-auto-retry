<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Single clockwise retry arrow: 300° arc, gap at top-right -->
  <path d="M 97,73 A 34,34 0 1 1 88,40" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Arrowhead triangle at 1:30 position -->
  <polygon points="100,52 82,44 92,32" fill="#ffffff" />

  <!-- Gemini 4-pointed sparkle star (centered, r=16, well inside the r=34 arrow ring) -->
  <path d="M 64 48 C 64 54.5 71.5 64 78 64 C 71.5 64 64 73.5 64 80 C 64 73.5 56.5 64 50 64 C 56.5 64 64 54.5 64 48 Z" 
        fill="url(#sparkGrad)" />
</svg>
